[project]
name = "kdx-ws-be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "konglingwen", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "deepagents>=0.7.5",
    "fastapi[standard]>=0.141.1",
    "insightface>=1.0.1",
    "jieba>=0.42.1",
    "jwt>=1.4.0",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.10",
    "loguru>=0.7.3",
    "pymilvus>=3.0.1",
    "pymysql>=1.2.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "text2vec>=1.3.8",
    "torch>=2.13.0",
    "uvicorn>=0.52.1",
    "lunar_python>=1.4.8",
    "boto3>=1.43.13",
]

[project.scripts]
kdx-ws-be = "kdx_ws_be:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

# torch 走 CPU 源, 避免 CUDA 版 (数 GB) 被拉入
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
