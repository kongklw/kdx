[project]
name = "kdx-ws-be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "konglingwen", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "deepagents>=0.7.5",
    "fastapi[standard]>=0.141.1",
    "insightface>=1.0.1",
    "jwt>=1.4.0",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.10",
    "loguru>=0.7.3",
    "pymysql>=1.2.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[project.scripts]
kdx-ws-be = "kdx_ws_be:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
